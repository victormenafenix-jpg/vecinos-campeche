<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vecinos en Red</title>
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f05a28">
<link rel="apple-touch-icon" href="icono-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#121420);--ink:light-dark(#1b1d2a,#f1efe9);--mut:light-dark(#5d6070,#a6a9b8);--sun:#f05a28;--sunk:light-dark(#c8441a,#ff8a5c);--sky:light-dark(#2457c5,#8fb0ff);--soft:light-dark(#fff1ea,#2a1b15);--skys:light-dark(#eaf0fd,#18223d);--line:light-dark(#e6e2dc,#2c2f3d);--card:light-dark(#ffffff,#1a1c29);--ok:light-dark(#1d7a46,#6fd39b);--no:light-dark(#b3261e,#ff8f86)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Archivo,system-ui,sans-serif;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,6vw,42px);font-weight:800}h2{font-size:23px;font-weight:800;margin-bottom:6px}h3{font-size:18px;font-weight:600}
.band{padding:clamp(18px,4vw,36px) max(5vw,16px)}.wrap{max-width:880px;margin:0 auto}
header{background:var(--sun);color:#fff}header p{margin:6px 0 0;opacity:.95}
header .wrap{display:flex;justify-content:space-between;gap:12px;align-items:end;flex-wrap:wrap}
header a{color:#fff}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}.bar .wrap{padding:8px max(5vw,16px) 0}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs a{flex:none;padding:10px 13px;min-height:44px;color:var(--mut);text-decoration:none;font-weight:600;border-bottom:3px solid transparent}
.tabs a.on{color:var(--ink);border-color:var(--sun)}
.view{display:none}.view.on{display:block}
.lead{color:var(--mut);margin:0 0 16px}.para{font-size:14px;color:var(--mut);margin:4px 0 0}
form{display:grid;gap:14px}label{display:grid;gap:5px;font-weight:600;font-size:15px}
label small,.hint{font-weight:400;color:var(--mut);font-size:13px}
select,input,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:80px;resize:vertical}:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}.row2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400}.chk input{width:22px;height:22px;min-height:0;flex:none;margin-top:2px}
fieldset{border:1.5px solid var(--line);border-radius:12px;padding:14px;margin:0;display:grid;gap:12px}legend{font-weight:600;padding:0 6px}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;min-height:44px;padding:10px 18px;cursor:pointer;background:var(--sun);color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.alt{background:var(--skys);color:var(--sky)}.btn.ghost{background:transparent;color:var(--sky);border:1.5px solid var(--line)}.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:wait}
.ine{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:center;background:var(--soft);border-radius:12px;padding:12px}
.ph{aspect-ratio:1.58;border-radius:8px;border:2px dashed var(--sunk);display:grid;place-items:center;font-size:12px;color:var(--sunk);overflow:hidden;background:var(--card)}.ph img{width:100%;height:100%;object-fit:cover}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--skys);border-radius:12px;padding:12px}.stat b{display:block;font:800 clamp(22px,5vw,30px)/1 Archivo,sans-serif;color:var(--sky)}.stat span{font-size:13px;color:var(--mut)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tools>*{flex:1 1 160px;width:auto}
.card{border:1.5px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;background:var(--card)}
.card .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}.card p{margin:6px 0}
.casa{border:1.5px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.casa>h3{background:var(--soft);padding:10px 14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.casa>h3 span{font:400 13px Inter,sans-serif;color:var(--mut)}
.per{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.per p{margin:0}.per small{color:var(--mut);display:block}.acts{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap;display:inline-block}
.tag.v{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}.tag.p{background:var(--soft);color:var(--sunk)}.tag.r{background:color-mix(in srgb,var(--no) 14%,transparent);color:var(--no)}.tag.g{background:var(--line);color:var(--mut)}
.res{display:grid;gap:6px;margin:12px 0}.res div{display:grid;grid-template-columns:7em minmax(0,1fr) 3em;gap:8px;align-items:center;font-size:14px}
.res i{display:block;height:12px;border-radius:6px;background:var(--line);overflow:hidden}.res i b{display:block;height:100%;border-radius:6px}.res em{font-style:normal;text-align:right}
.vote{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chips button{font:inherit;font-size:14px;font-weight:600;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;min-height:40px;padding:6px 14px;cursor:pointer}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cat{font-size:12px;font-weight:600;color:var(--sky)}.meta{font-size:14px;color:var(--mut)}
.note{background:var(--skys);border-radius:12px;padding:12px 14px;font-size:14px;margin:0 0 16px}
.warn{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:14px;margin:0 0 16px}
.msg{min-height:1.4em;font-weight:600;margin:0}.msg.ok{color:var(--ok)}.msg.err{color:var(--no)}
details{margin-top:16px}summary{cursor:pointer;font-weight:600;color:var(--sky);min-height:44px;display:flex;align-items:center}
.map{overflow-x:auto;padding:8px}.map svg{display:block;height:auto}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:92vw;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:20;display:none;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#ineBox{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;place-items:center;z-index:30;padding:16px}#ineBox img{max-width:100%;max-height:80vh;border-radius:10px;background:#fff}
#ineBox div{display:grid;gap:10px;justify-items:center;color:#fff}
.hide{display:none!important}
footer{color:var(--mut);font-size:13px;border-top:1px solid var(--line)}
@media(max-width:600px){.row,.row2{grid-template-columns:1fr}.ine{grid-template-columns:96px minmax(0,1fr)}.res div{grid-template-columns:6em minmax(0,1fr) 2.5em}}
</style>
</head>
<body>
<header class="band"><div class="wrap">
  <div><h1 id="hTit">Vecinos en Red</h1><p id="hSub">Padrón, avisos y consultas del fraccionamiento.</p></div>
  <div id="hUser" class="hint" style="color:#fff"></div>
</div></header>
<div class="bar"><div class="wrap"><nav class="tabs" id="tabs"></nav></div></div>

<main class="band"><div class="wrap" id="app"><p class="lead">Cargando…</p></div></main>
<div id="toast" role="alert"></div>
<div id="ineBox" role="dialog" aria-label="INE"><div><img id="ineImg" alt="Foto de la INE"><button class="btn" id="ineCerrar">Cerrar</button><small>Quedó anotado en la bitácora que abriste esta INE.</small></div></div>
<footer class="band"><div class="wrap">Vecinos en Red · Los datos son solo para el comité de cada fraccionamiento. No se usan para publicidad ni campañas. Puedes pedir que se borren tus datos con el comité.</div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
{
const LF=window.L,CAMPECHE=[19.8454,-90.5237];
const SB=supabase.createClient('https://wfxmkictnhqizpuftgvd.supabase.co','sb_publishable_Ll3XWrZf2hfdQlrU3bmqxQ_t_9Y6o_A');
const $=id=>document.getElementById(id), app=$('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const Q=new URLSearchParams(location.search);
const BASE=location.origin+location.pathname;
let tT;function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(tT);tT=setTimeout(()=>e.style.display='none',4200)}
const NOAUT='No estás autorizado. Esto solo lo puede hacer el comité.';
const LAB={favor:'A favor',contra:'En contra',abst:'Abstención'},COL={favor:'var(--ok)',contra:'var(--no)',abst:'var(--mut)'};
const CATS=['Cultural','Ventas','Servicios','Comunidad','Comité','Político'];
const telMX=t=>{let d=String(t||'').replace(/\D/g,'');if(d.length===10)d='52'+d;return d};
const fmt$=n=>'$'+(+n||0).toLocaleString('es-MX',{maximumFractionDigits:2});
const err=e=>{const m=(e&&e.message)||String(e);toast(/permission|policy|row-level|not authorized|autorizado/i.test(m)?NOAUT:m)};
async function rpc(n,a){const {data,error}=await SB.rpc(n,a);if(error)throw error;return data}

let FR=null, FRS=[], staff=null, tab='', mapSel=null;

function setTabs(list){$('tabs').innerHTML=list.map(([k,t])=>`<a href="#${k}" data-k="${k}">${t}</a>`).join('');}
function markTab(){document.querySelectorAll('#tabs a').forEach(a=>a.classList.toggle('on',a.dataset.k===tab))}

/* ---------- arranque ---------- */
async function init(){
 const {data}=await SB.from('fraccionamientos').select('*').order('nombre');FRS=data||[];
 if(Q.get('v'))return vistaCandidato(Q.get('v'));
 const {data:{session}}=await SB.auth.getSession();
 if(location.hash==='#comite'||session){if(session)return entrarStaff();return vistaLogin()}
 FR=FRS.find(f=>f.id===Q.get('f'));
 if(!FR)return vistaInicio();
 publico();
}
window.addEventListener('hashchange',()=>{if(location.hash==='#comite'&&!staff){vistaLogin();return}route()});
function route(){let h=location.hash.slice(1);if(!ROUTES[h])h=Object.keys(ROUTES)[0];if(!h)return;tab=h;markTab();ROUTES[h]()}
let ROUTES={},PRE=null;

function vistaInicio(){
 setTabs([]);$('hTit').textContent='Vecinos en Red';
 app.innerHTML=`<h2>Escoge tu fraccionamiento</h2><p class="lead">Cada fraccionamiento tiene su propio padrón. Toca el tuyo para inscribirte o ver los avisos.</p>
 ${FRS.map(f=>`<a class="card" style="display:block;text-decoration:none;color:inherit" href="?f=${f.id}"><h3>${esc(f.nombre)}</h3><span class="meta">Inscribirme y ver avisos</span></a>`).join('')}
 <p><a class="btn ghost" href="#comite">Entrar como comité</a></p><p class="para">Solo para validadores y administrador. Los vecinos no necesitan cuenta.</p>`;
}

/* ---------- PÚBLICO / VECINO ---------- */
let TOKEN=Q.get('t'), YO=null;
async function publico(){
 $('hTit').textContent=FR.nombre;$('hSub').textContent='Padrón, avisos y consultas de tu fraccionamiento.';
 if(TOKEN){try{YO=await rpc('yo',{p_token:TOKEN})}catch(e){YO=null}if(!YO||YO.fracc!==FR.id){YO=null;TOKEN=null;toast('Tu link personal no es válido para este fraccionamiento.')}}
 if(YO)$('hUser').textContent=`Hola, ${YO.nombre.split(' ')[0]} · ${YO.casa}`;
 const t=YO?[['avisos','Avisos'],['reportes','Reportes'],['consultas','Consultas'],['apoyos','Apoyos'],['emerg','Emergencias'],['repres','Quién te representa'],['visitas','Visitas'],['reglas','Reglas']]:[['inscribirme','Inscribirme'],['avisos','Avisos'],['reportes','Reportes'],['emerg','Emergencias'],['repres','Quién te representa'],['visitas','Visitas'],['reglas','Reglas']];
 setTabs(t);ROUTES={};t.forEach(([k])=>ROUTES[k]=PUB[k]);route();
}
const PUB={
 inscribirme(){const pre=PRE;PRE=null;
  const calles=FR.calles||[];
  if(!calles.length){app.innerHTML=`<h2>Inscripción al padrón</h2><p class="warn">El comité todavía está cargando las calles de ${esc(FR.nombre)}. Vuelve pronto.</p>`;return}
  app.innerHTML=`<h2>Inscripción al padrón</h2>
  <p class="lead">Cada adulto de la casa se inscribe por separado. Un hijo o nieto puede llenarlo por sus papás o abuelos.</p>
  <form id="fIns">
   <div class="row2"><label>Calle<select id="iCalle" required>${calles.map(c=>`<option>${esc(c.n)}</option>`).join('')}</select></label><label>Número<input id="iNum" required maxlength="12" inputmode="numeric"></label></div>
   <div class="note" style="margin:0"><b>¿Estás en tu casa ahorita?</b> Toca el botón para guardar su ubicación en el mapa del comité (opcional).<div class="vote"><button type="button" class="btn sm alt" id="iGeo">Guardar ubicación de mi casa</button><span class="meta" id="iGeoM"></span></div></div>
   <label>Nombre completo<input id="iNom" required minlength="3" maxlength="120" autocomplete="name"></label>
   <div class="row"><label>WhatsApp<input id="iTel" required inputmode="tel" maxlength="20" placeholder="981 000 0000"></label><label>Correo <small>(opcional)</small><input id="iMail" type="email" maxlength="120"></label></div>
   <div class="row"><label>Fecha de nacimiento <small>(para felicitarte)</small><input id="iNac" type="date"></label><label>Vive en la casa como<select id="iTipo"><option>Dueño</option><option>Inquilino</option><option>Familiar del dueño</option></select></label></div>
   <div class="ine"><div class="ph" id="iPrev">Foto INE</div><label>Foto de la INE, solo el frente<input id="iFoto" type="file" accept="image/*" required><small>Se guarda cerrada: solo la ve el comité. Puedes pedir que se borre.</small></label></div>
   <label>Últimos 4 caracteres de tu clave de elector<input id="iU4" required maxlength="4" pattern="[A-Za-z0-9]{4}" autocapitalize="characters"><small>Vienen en tu INE. Te los pediremos cada vez que votes, para saber que eres tú.</small></label>
   <fieldset><legend>Representante (opcional)</legend><p class="hint" style="margin:0">Para personas mayores: el familiar que vota y recibe avisos a su nombre.</p>
    <div class="row"><label>Nombre<input id="iRep" maxlength="120"></label><label>WhatsApp<input id="iRepTel" inputmode="tel" maxlength="20"></label></div></fieldset>
   <fieldset><legend>Datos de emergencia (opcional)</legend><p class="hint" style="margin:0">Para que el comité sepa cómo ayudar si te pasa algo. Solo los ve el comité.</p>
    <div class="row"><label>Tipo de sangre<select id="eSan"><option value="">No sé / prefiero no decir</option>${['O+','O-','A+','A-','B+','B-','AB+','AB-'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>Alergias<input id="eAle" maxlength="200"></label></div>
    <label>Algo importante de salud<input id="eSal" maxlength="200"></label><label>Contacto de emergencia<input id="eCto" maxlength="150" placeholder="Nombre y teléfono"></label>
    <label class="chk"><input type="checkbox" id="eOk">Autorizo que el comité guarde estos datos de salud solo para emergencias.</label></fieldset>
   <label class="chk"><input type="checkbox" id="iMay" required>Soy mayor de 18 años y vivo en este domicilio.</label>
   <label class="chk"><input type="checkbox" id="iAv" required>Acepto que mis datos sean solo para el comité de ${esc(FR.nombre)}, sin publicidad ni campañas, y que puedo pedir que se borren.</label>
   <button class="btn" type="submit" id="iBtn">Enviar inscripción</button><p class="para">Tu inscripción le llega al comité para que la valide. Cuando quede validada te mandan por WhatsApp tu link personal para votar.</p>
   <p class="msg" id="iMsg" role="status"></p></form>`;
  if(pre){$('iCalle').value=pre[0];$('iNum').value=pre[1]}
  let foto=null,geo=null;
  $('iGeo').onclick=()=>{if(!navigator.geolocation)return toast('Tu celular no permite ubicación.');$('iGeoM').textContent='Buscando…';navigator.geolocation.getCurrentPosition(p=>{geo=[p.coords.latitude,p.coords.longitude];$('iGeoM').textContent='Ubicación guardada ✓'},()=>{$('iGeoM').textContent='No se pudo. Revisa que la ubicación esté activada.'},{enableHighAccuracy:true,timeout:15000})};
  $('iFoto').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1200/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{foto=b;$('iPrev').innerHTML=`<img src="${URL.createObjectURL(b)}" alt="Vista previa">`},'image/jpeg',.8)};im.src=r.result};r.readAsDataURL(f)};
  $('fIns').onsubmit=async e=>{e.preventDefault();const m=$('iMsg');m.className='msg';
   const em=$('eSan').value||$('eAle').value.trim()||$('eSal').value.trim()||$('eCto').value.trim();
   if(em&&!$('eOk').checked){$('eOk').focus();toast('Para guardar datos de emergencia, marca la casilla de autorización.');return}
   if(!foto){toast('Falta la foto de la INE.');return}
   $('iBtn').disabled=true;m.textContent='Enviando…';
   try{const id=await rpc('inscribir',{p:{fracc:FR.id,calle:$('iCalle').value,numero:$('iNum').value,nombre:$('iNom').value,tel:$('iTel').value,correo:$('iMail').value,nac:$('iNac').value,tipo:$('iTipo').value,ult4:$('iU4').value,rep_nombre:$('iRep').value,rep_tel:$('iRepTel').value,mayor:$('iMay').checked,aviso:$('iAv').checked,em_ok:$('eOk').checked,sangre:$('eSan').value,alergias:$('eAle').value,salud:$('eSal').value,contacto:$('eCto').value,lat:geo?geo[0]:'',lng:geo?geo[1]:''}});
    const {error}=await SB.storage.from('ine').upload(`${FR.id}/${id}.jpg`,foto,{contentType:'image/jpeg',upsert:false});
    if(error)throw new Error('Se guardó tu inscripción pero no subió la foto. Avísale al comité.');
    await rpc('marcar_ine',{p_id:id});
    e.target.reset();$('iPrev').textContent='Foto INE';foto=null;m.className='msg ok';m.textContent='¡Listo! Tu inscripción quedó pendiente. El comité la revisará y te escribirá por WhatsApp.';
   }catch(x){m.className='msg err';m.textContent=x.message}finally{$('iBtn').disabled=false}};
 },
 async avisos(){
  app.innerHTML=`<h2>Avisos de ${esc(FR.nombre)}</h2><p class="lead">Eventos, ventas de vecinos, servicios y noticias de la comunidad.${YO?' Toca "Voy a asistir" para que el organizador sepa cuántos van.':' Para confirmar asistencia necesitas tu link personal, que te manda el comité cuando quedas validado.'}</p><div class="chips" id="aCh"></div><div id="aL">Cargando…</div>
  ${YO?`<details><summary>Publicar un aviso</summary><form id="fAv"><label>Categoría<select id="aCat"><option>Cultural</option><option>Ventas</option><option>Servicios</option><option>Comunidad</option></select></label><label>Título<input id="aTit" required minlength="3" maxlength="120"></label><label>Detalle<textarea id="aTxt" maxlength="1000"></textarea></label><div class="row"><label>Fecha<input id="aFec" maxlength="60"></label><label>Lugar<input id="aLug" maxlength="120"></label></div><button class="btn">Publicar</button><p class="para">Máximo 3 avisos al día. Los avisos políticos solo los publica el comité al aprobar una visita.</p></form></details>`:''}`;
  let cat='Todos',L=[];
  const draw=()=>{$('aCh').innerHTML=['Todos',...CATS].map(c=>`<button type="button" class="${c===cat?'on':''}" data-c="${c}">${c}</button>`).join('');
   $('aL').innerHTML=L.filter(a=>cat==='Todos'||a.cat===cat).map(a=>`<div class="card"><span class="cat">${esc(a.cat)}</span><h3>${esc(a.titulo)}</h3>${a.texto?`<p>${esc(a.texto)}</p>`:''}<p class="meta">${esc(a.fecha||'')}${a.lugar?' · '+esc(a.lugar):''}</p><div class="vote"><button class="btn sm ${a.yo?'':'alt'}" data-a="${a.id}">${a.yo?'Voy a asistir ✓':'Voy a asistir'}</button><span class="meta">${a.asis} confirmaron</span></div></div>`).join('')||'<p class="lead">No hay avisos todavía.</p>'};
  const load=async()=>{L=await rpc('avisos_publicos',{p_fracc:FR.id,p_token:TOKEN});draw()};

  $('kSG').onclick=async()=>{const o={secciones:$('kSe').value.trim()||null,distrito_local:$('kDl').value.trim()||null,distrito_federal:$('kDf').value.trim()||null,casilla:$('kCa').value.trim()||null,casilla_nota:$('kCn').value.trim()||null};const {data,error}=await SB.from('fraccionamientos').update(o).eq('id',FR.id).select();if(error||!data.length)return toast(NOAUT);Object.assign(FR,o);toast('Guardado.');loadR()};
  $('kCen').onclick=()=>{if(!navigator.geolocation)return toast('Tu celular no permite ubicación.');navigator.geolocation.getCurrentPosition(async p=>{const {data,error}=await SB.from('fraccionamientos').update({lat:p.coords.latitude,lng:p.coords.longitude}).eq('id',FR.id).select();if(error||!data.length)return toast(NOAUT);FR.lat=p.coords.latitude;FR.lng=p.coords.longitude;toast('Centro guardado.');ST.calles()},()=>toast('No se pudo. Activa la ubicación del celular.'),{enableHighAccuracy:true,timeout:15000})};
  let C=JSON.parse(JSON.stringify(FR.calles||[]));
  const draw=()=>{$('kc').innerHTML=C.map((c,i)=>`<div style="display:flex;gap:6px;margin-top:8px"><input data-i="${i}" data-f="n" value="${esc(c.n)}" placeholder="Calle" aria-label="Calle"><button class="btn sm ghost" data-x="${i}">Quitar</button></div>`).join('')||'<p class="meta">Sin calles todavía.</p>'};
  draw();
  $('kc').oninput=e=>{const i=e.target.dataset.i;if(i==null)return;C[i].n=e.target.value};
  $('kc').onclick=e=>{if(e.target.dataset.x!=null){C.splice(+e.target.dataset.x,1);draw()}};
  $('kAdd').onclick=()=>{C.push({n:''});draw()};
  $('kG').onclick=async()=>{C=C.filter(c=>c.n.trim()).map(c=>({n:c.n.trim()}));const {data,error}=await SB.from('fraccionamientos').update({calles:C}).eq('id',FR.id).select();if(error||!data.length)return toast(NOAUT);FR.calles=C;FRS=FRS.map(f=>f.id===FR.id?FR:f);toast('Calles guardadas.');draw()};
  $('cpI').onclick=async()=>{try{await navigator.clipboard.writeText(linkI);toast('Link copiado.')}catch(x){toast('No se pudo copiar.')}};
 },
 async admin(){

  app.innerHTML=`<h2>Administración</h2>

   const {data:B}=await SB.from('bitacora').select('*').order('created_at',{ascending:false}).limit(50);const nom=id=>(P.find(p=>p.id===id)||{}).nombre||'—';
   $('bL').innerHTML=B.map(b=>`<div class="per" style="padding-inline:0"><p>${esc(nom(b.usuario))} · ${esc(b.accion)}${b.detalle?' · '+esc(b.detalle):''}<small>${new Date(b.created_at).toLocaleString('es-MX')}</small></p></div>`).join('')||'<p class="meta">Sin movimientos.</p>'};
  $('vlL').onclick=async e=>{const id=e.target.dataset.q;if(!id||!await confirmar('¿Quitar a este validador? Ya no podrá entrar.'))return;try{const r=await rpc('quitar_validador',{p_id:id});if(r!=='ok')toast(r);load()}catch(x){err(x)}};
  $('fV').onsubmit=async e=>{e.preventDefault();try{const r=await rpc('crear_validador',{p_email:$('vaE').value,p_nombre:$('vaN').value,p_fracc:$('vaF').value,p_clave:$('vaP').value});if(r!=='ok')return toast(r);toast('Cuenta creada. Mándale su correo y contraseña temporal.');e.target.reset();load()}catch(x){err(x)}};
  $('fF').onsubmit=async e=>{e.preventDefault();const {error}=await SB.from('fraccionamientos').insert({id:$('fI').value.trim(),nombre:$('fN').value.trim()});if(error)return err(error);const {data}=await SB.from('fraccionamientos').select('*').order('nombre');FRS=data;toast('Fraccionamiento creado. Agrégale sus calles en "Calles y links".');entrarStaff()};
  load().catch(err);
 }
};

const RCATS=['Alumbrado','Agua y drenaje','Basura y limpieza','Calles y banquetas','Seguridad','Parques y áreas verdes','Otro'];
const fotoRep=p=>SB.storage.from('reportes').getPublicUrl(p).data.publicUrl;
function dibReportes(L,extra){return L.map(r=>`<div class="card"><div class="top"><span class="cat">${esc(r.cat)}</span><span class="tag ${r.estado==='Resuelto'?'v':r.estado==='En atención'?'p':'g'}">${r.estado}</span></div><h3>${esc(r.titulo)}</h3>${r.texto?`<p>${esc(r.texto)}</p>`:''}
 ${r.foto_path?`<img src="${fotoRep(r.foto_path)}" alt="Foto del reporte" loading="lazy" style="width:100%;max-height:260px;object-fit:cover;border-radius:10px;margin:6px 0">`:''}
 <p class="meta">${esc(r.lugar||'')}${r.lugar?' · ':''}${new Date(r.created_at).toLocaleDateString('es-MX',{day:'numeric',month:'short'})}${r.lat?` · <a href="https://www.google.com/maps/search/?api=1&query=${r.lat},${r.lng}">Ver en el mapa</a>`:''}</p>
 ${r.respuesta?`<p class="note" style="margin:6px 0 0"><b>Comité:</b> ${esc(r.respuesta)}</p>`:''}${extra?extra(r):''}</div>`).join('')||'<p class="lead">No hay reportes aquí.</p>'}
async function dibTels(f,editable){const {data,error}=await SB.from('telefonos').select('*').eq('fracc_id',f.id).order('orden').order('id');if(error)return `<p class="warn">${esc(error.message)}</p>`;
 return data.map(t=>`<div class="per card" style="margin-bottom:8px"><p><b>${esc(t.nombre)}</b>${t.nota?`<small>${esc(t.nota)}</small>`:''}</p><span class="acts"><a class="btn" href="tel:${esc(t.telefono.replace(/[^\d+]/g,''))}">${esc(t.telefono)}</a>${editable?`<button class="btn sm ghost" data-td="${t.id}">Quitar</button>`:''}</span></div>`).join('')}
const REGLAS=f=>`<h2>Reglas de Vecinos en Red</h2><p class="lead">Las reglas de ${esc(f.nombre)}. El comité las puede ajustar en asamblea.</p>
 <div class="card"><h3>Quién ve tus datos</h3><p>Solo el comité de tu fraccionamiento ve tu nombre, teléfono, INE y datos de emergencia. Nadie más: ni otros vecinos, ni candidatos, ni partidos. Tus datos no se usan para publicidad ni campañas. Puedes pedir que se borren cuando quieras.</p></div>
 <div class="card"><h3>Cómo se vota</h3><p>Votan los adultos validados con su link personal y los últimos 4 caracteres de su clave de elector. Hay dos tipos: <b>por persona</b> (cada adulto cuenta) para opiniones y peticiones, y <b>por casa</b> (un voto por domicilio) para cuotas y obras. Una persona mayor puede votar por medio de su representante registrado.</p></div>
 <div class="card"><h3>Qué se puede publicar</h3><p>Avisos de eventos, ventas de vecinos, servicios y noticias de la comunidad, con respeto. No se permiten insultos, chismes ni datos personales de otros. Los avisos de fallecimiento solo con permiso de la familia. El comité puede borrar lo que no cumpla.</p></div>
 <div class="card"><h3>Visitas de candidatos</h3><p>Cualquier partido puede pedir una visita, con la misma regla para todos. El comité la aprueba y avisa a los vecinos. El candidato solo ve cuántos confirmaron, nunca nombres ni teléfonos.</p></div>
 <div class="card"><h3>Reportes y apoyos</h3><p>Los reportes son para problemas del fraccionamiento, no para acusar a personas. Para algo urgente llama al 911. Las donaciones van a la cuenta del comité y cada movimiento se publica para que todos lo vean.</p></div>`;
async function dibRepres(f,editable){
 const {data,error}=await SB.from('representantes').select('*').eq('fracc_id',f.id).order('orden');if(error)return `<p class="warn">${esc(error.message)}</p>`;
 return `<div class="stats"><div class="stat"><b>${esc(f.secciones||'—')}</b><span>sección electoral</span></div><div class="stat"><b>${esc(f.distrito_local||'—')}</b><span>distrito local</span></div><div class="stat"><b>${esc(f.distrito_federal||'—')}</b><span>distrito federal</span></div></div>`+
 (f.casilla?`<div class="card"><span class="cat">Dónde votas</span><h3>${esc(f.casilla)}</h3>${f.casilla_nota?`<p class="para">${esc(f.casilla_nota)}</p>`:''}<a class="btn sm alt" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(f.casilla+', Campeche')}">Ver en el mapa</a></div>`:'')+
 (data.map(r=>`<div class="card"><span class="cat">${esc(r.cargo)}</span><h3>${esc(r.nombre)}</h3><p class="meta">${esc(r.partido||'')}${r.distrito?' · '+esc(r.distrito):''}</p>
  ${r.telefono?`<p>Teléfono: <a href="tel:${esc(r.telefono.replace(/[^\d+]/g,''))}">${esc(r.telefono)}</a></p>`:''}${r.correo?`<p>Correo: ${esc(r.correo)}</p>`:''}${r.oficina?`<p>Oficina: ${esc(r.oficina)}</p>`:''}
  <p class="para">Fuente: ${esc(r.fuente||'—')} · Revisado el ${r.verificado?new Date(r.verificado+'T12:00').toLocaleDateString('es-MX'):'—'}</p>${editable?`<button class="btn sm ghost" data-rd="${r.id}">Quitar</button>`:''}</div>`).join('')||'<p class="lead">Todavía no se cargan representantes.</p>')+
 `<p class="para">Puedes confirmar tu sección en tu INE y tu distrito en la página del INE o del IEEC. Si algún dato cambió, avísale al comité.</p>`;
}
function comprimir(f,max){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=()=>no(new Error('No se pudo leer la foto.'));im.onload=()=>{const k=Math.min(1,max/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(new Error('No se pudo procesar la foto.')),'image/jpeg',.8)};im.src=r.result};r.readAsDataURL(f)})}
function dibApoyos(L){
 const ent=L.filter(x=>x.tipo==='Entrada').reduce((a,x)=>a+(+x.monto||0),0),sal=L.filter(x=>x.tipo==='Entrega').reduce((a,x)=>a+(+x.monto||0),0);
 return `<div class="stats"><div class="stat"><b>${fmt$(ent)}</b><span>entró</span></div><div class="stat"><b>${fmt$(sal)}</b><span>se entregó</span></div><div class="stat"><b>${fmt$(ent-sal)}</b><span>queda</span></div></div>`+
 (L.map(x=>`<div class="per card" style="margin-bottom:8px"><p><b>${esc(x.concepto)}</b><small>${esc(x.fecha||'')}${x.especie?' · En especie: '+esc(x.especie):''}</small></p><span class="tag ${x.tipo==='Entrada'?'v':'p'}">${x.tipo}${+x.monto?' '+fmt$(x.monto):''}</span></div>`).join('')||'<p class="lead">Sin movimientos todavía.</p>');
}

init().catch(e=>{app.innerHTML=`<p class="warn">No se pudo cargar: ${esc(e.message)}</p>`});
